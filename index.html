  <body>
    <div id="root"></div>
    <script>
      // Após um novo deploy, uma aba que já estava aberta pode tentar carregar
      // um arquivo JS com hash antigo que não existe mais no servidor — o
      // Vercel devolve index.html (rewrite de SPA) no lugar, e o navegador
      // rejeita por MIME type errado, deixando a tela em branco. Detecta essa
      // falha de carregamento de script e recarrega a página uma única vez
      // (a flag evita loop caso o problema seja outro).
      (function () {
        var KEY = "jurex-reload-on-script-error";
        window.addEventListener(
          "error",
          function (event) {
            if (event.target && event.target.tagName === "SCRIPT" && !sessionStorage.getItem(KEY)) {
              sessionStorage.setItem(KEY, "1");
              window.location.reload();
            }
          },
          true
        );
      })();
    </script>
